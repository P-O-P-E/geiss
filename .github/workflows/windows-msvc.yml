name: Build for Windows using MSVC

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: '0 2 * * 5'  # Every Friday at 2am

jobs:
  standalone-x64:
    name: Build standalone app for Windows 11 x64
    runs-on: windows-2022
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Configure build
      run: |-
        cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64 -DGEISS_BUILD_LEGACY=OFF

    - name: Build standalone app
      run: |-
        cmake --build build-x64 --config RelWithDebInfo --target geiss

    - name: Upload standalone app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: "Geiss-Windows-x64-${{ github.sha }}"
        path: "build-x64/RelWithDebInfo/Geiss.exe"
        if-no-files-found: error

  legacy-x86:
    name: Build legacy 32-bit screensaver and Winamp plug-in
    runs-on: windows-2022
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Configure build
      run: |-
        cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32 -DGEISS_BUILD_LEGACY=ON

    - name: Build legacy targets
      run: |-
        cmake --build build-x86 --config RelWithDebInfo --target geiss_scr vis_geis

    - name: Build plug-in installer + prepare artifacts for upload
      shell: bash
      run: |-
        set -x
        find . -name .git -prune -o -type f | sort -f
        cp -v build-x86/RelWithDebInfo/geiss_scr.exe bin_saver/geiss.scr  # for upload
        cp -v build-x86/RelWithDebInfo/vis_geis.dll bin_plugin/  # for upload and installer

        ./makensis_198 installer_PLUGIN.nsi  # writes to bin_plugin/
        find bin_*/ -type f | sort -f

        mv bin_plugin/geiss4winamp_430.exe ./  # i.e. out of bin_plugin/

    - name: Upload screensaver binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: "geiss_saver_430_${{ github.sha }}"
        path: "bin_saver/*"
        if-no-files-found: error

    - name: Upload plug-in binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: "geiss4winamp_430_${{ github.sha }}"
        path: "bin_plugin/*"
        if-no-files-found: error

    - name: Upload plug-in installer
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: "geiss4winamp_430_installer_${{ github.sha }}"
        path: "geiss4winamp_430.exe"
        if-no-files-found: error
